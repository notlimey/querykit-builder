name: Release

# Auto-release on push is disabled — publishing is done manually for now.
# Re-enable by restoring the `push` trigger below.
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      # Topological build: react-querykit-builder's tsc run needs the core
      # package's dist/*.d.ts, which the workspace link points at.
      - name: Build Packages
        run: pnpm -r --include-workspace-root build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
